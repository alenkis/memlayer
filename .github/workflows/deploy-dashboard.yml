name: Deploy Dashboard

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VERCEL_PROJECT_ID: op://MemLayer/VERCEL_APP_PROJECT_ID/credential
          VERCEL_TOKEN: op://MemLayer/VERCEL_TOKEN/password

      - name: Set up Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest
          bb: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate shadow-cljs.edn
        run: bb shadow-cljs-edn

      - name: Build CLJS dashboard
        run: npx shadow-cljs -A:dashboard release dashboard

      - name: Build CSS
        run: npm run build:css

      - name: Prepare Vercel deployment
        run: |
          npx vercel pull --yes --token=${{ env.VERCEL_TOKEN }}
          npx vercel build --prod --token=${{ env.VERCEL_TOKEN }}
          mkdir -p /tmp/vercel-deploy/.vercel
          cp .vercel/project.json /tmp/vercel-deploy/.vercel/
          cp -r .vercel/output /tmp/vercel-deploy/.vercel/output

      - name: Deploy
        id: deploy
        working-directory: /tmp/vercel-deploy
        run: |
          npx vercel deploy --prebuilt --prod --token=${{ env.VERCEL_TOKEN }} | tee /tmp/vercel-deploy.log
          URL=$(grep -oE 'https://[^ ]+' /tmp/vercel-deploy.log | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"
