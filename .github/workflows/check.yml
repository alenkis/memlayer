name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Detect relevant changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            clojure:
              - 'src/**'
              - 'resources/**'
              - 'deps.edn'
              - 'bb.edn'
              - 'bb/**'
              - 'test/**'

      - name: No relevant changes
        if: steps.changes.outputs.clojure != 'true'
        run: echo "No Clojure code changed — skipping build, lint, and tests"

      - name: Set up Java 22
        if: steps.changes.outputs.clojure == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - name: Install Clojure CLI
        if: steps.changes.outputs.clojure == 'true'
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest
          clj-kondo: latest
          bb: latest

      - name: Cache Clojure deps
        if: steps.changes.outputs.clojure == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-deps-${{ hashFiles('deps.edn') }}
          restore-keys: clj-deps-

      - name: Set up Node.js
        if: steps.changes.outputs.clojure == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        if: steps.changes.outputs.clojure == 'true'
        run: npm ci

      - name: Initialize clj-kondo cache
        if: steps.changes.outputs.clojure == 'true'
        run: clj-kondo --copy-configs --dependencies --lint "$(clojure -Spath -M:test)" --skip-lint || true
        env:
          JAVA_CMD: java

      - name: Run check (build + lint + test)
        if: steps.changes.outputs.clojure == 'true'
        run: bb check
        env:
          JAVA_CMD: java
