name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to deploy (e.g. v0.3.1). Leave empty to deploy HEAD.'
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate tag is on main
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          TAG_COMMIT=$(git rev-list -n 1 ${{ github.ref }})
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag must be on the main branch"
            exit 1
          fi

  deploy-api:
    needs: [validate-tag]
    if: ${{ always() && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped') }}
    uses: ./.github/workflows/deploy-api.yml
    with:
      ref: ${{ inputs.version || '' }}
    secrets: inherit

  deploy-dashboard:
    needs: [validate-tag]
    if: ${{ always() && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped') }}
    uses: ./.github/workflows/deploy-dashboard.yml
    with:
      ref: ${{ inputs.version || '' }}
    secrets: inherit

  deploy-docs:
    needs: [validate-tag]
    if: ${{ always() && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped') }}
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: ${{ inputs.version || '' }}
    secrets: inherit

  deploy-marketing:
    needs: [validate-tag]
    if: ${{ always() && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped') }}
    uses: ./.github/workflows/deploy-marketing.yml
    with:
      ref: ${{ inputs.version || '' }}
    secrets: inherit

  create-release:
    name: Create GitHub Release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [deploy-api, deploy-dashboard, deploy-docs, deploy-marketing]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create GitHub Release (if not already created via UI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists (created via GitHub UI)"
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
