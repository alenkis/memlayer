name: E2E Tests

on:
  workflow_dispatch:

jobs:
  integration:
    name: Integration e2e (in-memory server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest
          bb: latest

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-deps-${{ hashFiles('deps.edn') }}
          restore-keys: clj-deps-

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OPENAI_API_KEY: op://MemLayer/OpenAIAPIKey/password
          GROQ_API_KEY: op://MemLayer/GroqAPIKey/password

      - name: Run integration e2e tests
        run: bb test-integration
        env:
          JAVA_CMD: java

  playwright:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest
          bb: latest

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-deps-${{ hashFiles('deps.edn') }}
          restore-keys: clj-deps-

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OPENAI_API_KEY: op://MemLayer/OpenAIAPIKey/password
          GROQ_API_KEY: op://MemLayer/GroqAPIKey/password

      - name: Build dashboard
        run: bb dashboard-build

      - name: Run Playwright tests
        run: npx playwright test
        env:
          JAVA_CMD: java

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4.6
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
